<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Notes</h1>
    </header>

    <section class="add-box">
      <form id="note-form">
        <input type="text" id="title-input" placeholder="العنوان" required />
        <textarea id="content-input" placeholder="التفاصيل (اختياري)"></textarea>
        <button type="submit">إضافة</button>
      </form>
      <p id="status-msg"></p>
    </section>

    <section>
      <div id="notes-list" class="notes-list"></div>
    </section>
  </div>

  <!-- config.js بيتولد وقت تشغيل الـ container (envsubst) وبيحدد API_BASE_URL -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
